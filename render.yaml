services:
  - type: web
    name: scg-pilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE
        value: instance/scg.sqlite
      - key: UPLOAD_FOLDER
        value: instance/uploads
      - key: FIRMS_MAP_KEY
        sync: false
