{% extends "base.html" %}{% block content %}<h1>Service dashboard</h1><form><select name="status"><option value="">All status</option>{% for x in statuses %}<option>{{x}}</option>{% endfor %}</select><select name="priority"><option value="">All priority</option>{% for x in priorities %}<option>{{x}}</option>{% endfor %}</select><button>Filter</button></form><table><tr><th>ID</th><th>Type</th><th>Status</th><th>Priority</th></tr>{% for i in incidents %}<tr><td><a href="/incidents/{{i.id}}">{{i.public_id}}</a></td><td>{{i.type}}</td><td>{{i.status}}</td><td>{{i.priority}}</td></tr>{% endfor %}</table>{% endblock %}
