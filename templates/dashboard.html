{% extends "base.html" %}{% block content %}<h1>Контролна табла</h1><form><select name="status"><option value="">Сите статуси</option>{% for x in statuses %}<option value="{{x}}">{{status_labels[x]}}</option>{% endfor %}</select><select name="priority"><option value="">Сите приоритети</option>{% for x in priorities %}<option value="{{x}}">{{priority_labels[x]}}</option>{% endfor %}</select><button>Филтрирај</button></form><table><tr><th>ID</th><th>Тип</th><th>Статус</th><th>Приоритет</th></tr>{% for i in incidents %}<tr><td><a href="/incidents/{{i.id}}">{{i.public_id}}</a></td><td>{{type_labels[i.type]}}</td><td>{{status_labels[i.status]}}</td><td>{{priority_labels[i.priority]}}</td></tr>{% endfor %}</table>{% endblock %}
