{% extends "base.html" %}
{% block content %}
<h1>Админ панел — корисници и улоги</h1>
<h2>Креирај службеник или корисник</h2>
<form method="post" action="{{url_for('admin_create_user')}}">
  <label>Е-пошта<input type="email" name="email" required></label>
  <label>Име<input name="name" required></label>
  <label>Лозинка (најмалку 8 знаци)<input type="password" name="password" minlength="8" required></label>
  <label>Улога<select name="role">{% for role in roles %}<option value="{{role}}">{{role}}</option>{% endfor %}</select></label>
  <label>Агенција<select name="agency_id"><option value="">-- нема --</option>{% for agency in agencies %}<option value="{{agency.id}}">{{agency.name}}</option>{% endfor %}</select></label>
  <label>Општина<input name="municipality"></label>
  <label>Регион<input name="region"></label>
  <button>Креирај корисник</button>
</form>
<h2>Постоечки корисници</h2>
{% for user in users %}
<form class="admin-user" method="post" action="{{url_for('admin_update_user', user_id=user.id)}}">
  <strong>{{user.email}}</strong>
  <input name="name" value="{{user.name}}" required>
  <select name="role">{% for role in roles %}<option value="{{role}}" {% if role==user.role %}selected{% endif %}>{{role}}</option>{% endfor %}</select>
  <select name="agency_id"><option value="">-- нема --</option>{% for agency in agencies %}<option value="{{agency.id}}" {% if agency.id==user.agency_id %}selected{% endif %}>{{agency.name}}</option>{% endfor %}</select>
  <input name="municipality" value="{{user.municipality or ''}}" placeholder="Општина">
  <input name="region" value="{{user.region or ''}}" placeholder="Регион">
  <label><input type="checkbox" name="is_active" {% if user.is_active %}checked{% endif %}> Активен</label>
  <button>Зачувај</button>
</form>
<form class="password-reset" method="post" action="{{url_for('admin_reset_password', user_id=user.id)}}">
  <input type="password" name="password" minlength="8" placeholder="Нова лозинка (8+)" required>
  <button>Ресетирај лозинка</button>
</form>
{% else %}<p>Нема корисници.</p>{% endfor %}
{% endblock %}
