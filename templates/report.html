{% extends "base.html" %}{% block content %}<h1>Пријави инцидент</h1><form method="post" enctype="multipart/form-data"><label>Тип<select name="type">{% for x in incident_types %}<option>{{x}}</option>{% endfor %}</select></label><label>Наслов<input name="title" required maxlength="160"></label><label>Опис<textarea name="description" required maxlength="5000"></textarea></label><label>Latitude<input id="latitude" name="latitude" value="41.998" required></label><label>Longitude<input id="longitude" name="longitude" value="21.425" required></label><button type="button" id="locate">Користи ја мојата GPS локација</button><p id="location-status" role="status"></p><div id="report-map"></div><small>Кликни на мапата за рачно да ја означиш локацијата.</small><label>Приоритет<select name="priority">{% for x in priorities %}<option>{{x}}</option>{% endfor %}</select></label><label>M/ETHANE<textarea name="m_ethane" maxlength="2000"></textarea></label><label>Име на пријавувач<input name="reporter_name"></label><label>Контакт<input name="contact"></label><label>Фото (max 5MB)<input type="file" name="photo" accept="image/*"></label><button>Испрати</button></form>{% endblock %}{% block scripts %}<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>(function(){const lat=document.getElementById('latitude'),lon=document.getElementById('longitude'),status=document.getElementById('location-status');const map=L.map('report-map').setView([Number(lat.value),Number(lon.value)],8);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);let marker=L.marker([Number(lat.value),Number(lon.value)],{draggable:true}).addTo(map);function setLocation(a,b){lat.value=a.toFixed(6);lon.value=b.toFixed(6);marker.setLatLng([a,b]);map.setView([a,b],14)}marker.on('dragend',function(){const p=marker.getLatLng();setLocation(p.lat,p.lng)});map.on('click',function(e){setLocation(e.latlng.lat,e.latlng.lng)});document.getElementById('locate').addEventListener('click',function(){if(!navigator.geolocation){status.textContent='GPS не е достапен на овој уред.';return}status.textContent='Се бара GPS локација…';navigator.geolocation.getCurrentPosition(function(p){setLocation(p.coords.latitude,p.coords.longitude);status.textContent='Локацијата е преземена од GPS.'},function(){status.textContent='Не може да се преземе GPS локацијата. Провери дозволи и обиди се повторно.'},{enableHighAccuracy:true,timeout:15000,maximumAge:30000})})})();</script>{% endblock %}
