{% extends "base.html" %}{% block content %}<h1>Пријави инцидент</h1><form method="post" enctype="multipart/form-data"><label>Тип<select name="type">{% for x in incident_types %}<option>{{x}}</option>{% endfor %}</select></label><label>Наслов<input name="title" required maxlength="160"></label><label>Опис<textarea name="description" required maxlength="5000"></textarea></label><label>Latitude<input name="latitude" value="41.998" required></label><label>Longitude<input name="longitude" value="21.425" required></label><label>Приоритет<select name="priority">{% for x in priorities %}<option>{{x}}</option>{% endfor %}</select></label><label>M/ETHANE<textarea name="m_ethane" maxlength="2000"></textarea></label><label>Име на пријавувач<input name="reporter_name"></label><label>Контакт<input name="contact"></label><label>Фото (max 5MB)<input type="file" name="photo" accept="image/*"></label><button>Испрати</button></form>{% endblock %}
