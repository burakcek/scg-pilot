{% extends "base.html" %}{% block content %}<h1>{{t.get('register','Регистрација') if register else t.get('login','Најава')}}</h1><form method="post"><label>{{t.get('email','Е-пошта')}}<input type="email" name="email" required></label>{% if register %}<label>{{t.get('name','Име')}}<input name="name" required></label>{% endif %}<label>{{t.get('password','Лозинка')}}<input type="password" name="password" minlength="8" required></label><button>{{"Krijo profil" if sq and register else "Најави се" if not sq and not register else "Hyr" if sq else "Креирај профил"}}</button></form>{% endblock %}
